name: Build

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Build plugin packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin

      - name: Read pinned Kandev source revision
        id: sdk
        working-directory: plugin
        run: |
          set -euo pipefail
          sdk_ref="$(cat .kandev-sdk-ref)"
          [[ "$sdk_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$sdk_ref" >> "$GITHUB_OUTPUT"

      - name: Check out Kandev SDK source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: kdlbs/kandev
          ref: ${{ steps.sdk.outputs.ref }}
          path: kandev
          sparse-checkout: |
            apps/backend
            apps/packages/plugin-sdk

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install locked UI dependencies
        working-directory: plugin
        run: npm ci

      - name: Build host binary
        working-directory: plugin
        run: make build

      - name: Package and verify all supported platforms
        working-directory: plugin
        run: make package verify-package
